<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0F172A" />
    <title>Offline — eSZ OFFICE</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f8fafc;
        --card: #ffffff;
        --border: #e2e8f0;
        --text: #0f172a;
        --muted: #475569;
        --accent: #1d4ed8;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b1120;
          --card: #111827;
          --border: #1f2937;
          --text: #f1f5f9;
          --muted: #94a3b8;
          --accent: #3b82f6;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      main {
        width: 100%;
        max-width: 440px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 32px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 22px;
        line-height: 1.3;
      }
      p {
        margin: 0 0 24px;
        font-size: 15px;
        line-height: 1.6;
        color: var(--muted);
      }
      .actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }
      a, button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 10px 18px;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text);
      }
      .primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You are currently offline</h1>
      <p>
        This page was not cached yet, but your local files in eSZ OFFICE remain stored on your device.
        Return to the home workspace or retry when your connection is back.
      </p>
      <div class="actions">
        <a class="primary" href="/">Open eSZ OFFICE</a>
        <button type="button" onclick="window.location.reload()">Retry</button>
      </div>
    </main>
  </body>
</html>
